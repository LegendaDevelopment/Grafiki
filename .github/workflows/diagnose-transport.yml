name: Diagnose LEGENDA transport
on:
  push:
    branches: ['import/legenda-planner-20261116']
    paths: ['.github/workflows/diagnose-transport.yml', '.bootstrap/diagnose.py']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .bootstrap/diagnose.py
      - uses: actions/upload-artifact@v7
        with:
          name: transport-diagnostics
          path: transport-diagnostics/
          retention-days: 1
          if-no-files-found: error
