name: Verify and publish LEGENDA PLANNER
on:
  push:
    branches: ['import/legenda-planner-20261116']
    paths: ['.bootstrap/PUBLISH_FULL_CHECKOUT']
permissions:
  contents: write
concurrency:
  group: initial-legenda-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: import/legenda-planner-20261116
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore verified sources, run tests and publish
        run: python .bootstrap/publish.py
